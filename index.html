<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Esquema Interativo de Medicamentos</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background-color: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 10px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
        gap: 8px;
        background-color: #ccc;
        padding: 10px;
        width: 100%;
        max-width: 500px;
        box-sizing: border-box;
      }
      .item {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        border-radius: 4px;
        cursor: pointer;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
      }
      .dot {
        width: 18%;
        aspect-ratio: 1 / 1;
        border-radius: 50%;
        background-color: black;
        margin: 2%;
      }
      .tooltip {
        position: absolute;
        bottom: -70px;
        left: 50%;
        transform: translateX(-50%);
        background: #fff;
        padding: 8px;
        border: 1px solid #333;
        border-radius: 4px;
        font-size: 12px;
        white-space: normal;
        display: none;
        z-index: 10;
        width: max-content;
        max-width: 200px;
        text-align: center;
      }
      .item:hover .tooltip,
      .item:active .tooltip {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <!-- Exemplo de quadro com 6 bolinhas e fundo rosa -->
      <div class="item" style="background-color: pink">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="tooltip">
          Paracetamol 200mg/ml<br />Uso oral<br />Antitérmico
        </div>
      </div>

      <!-- Exemplo de quadro com 4 bolinhas e fundo azul -->
      <div class="item" style="background-color: skyblue">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="tooltip">
          Dipirona Sódica 500mg/ml<br />Analgesia leve<br />Uso hospitalar
        </div>
      </div>

      <!-- Adicione os demais blocos conforme a imagem -->
    </div>
  </body>
</html>
