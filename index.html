<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Esquema Interativo de Medicamentos</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background-color: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(8, 100px);
        gap: 6px;
        background-color: #ccc;
        padding: 10px;
      }
      .item {
        position: relative;
        width: 100px;
        height: 100px;
        border-radius: 4px;
        cursor: pointer;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
      }
      .dot {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background-color: black;
        margin: 2px;
      }
      .tooltip {
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        background: #fff;
        padding: 10px;
        border: 1px solid #333;
        border-radius: 4px;
        white-space: nowrap;
        display: none;
        z-index: 1;
      }
      .item:hover .tooltip {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <!-- Exemplo de quadro com 6 bolinhas e fundo rosa -->
      <div class="item" style="background-color: pink">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="tooltip">Paracetamol 200mg/ml\nUso oral\nAntitérmico</div>
      </div>

      <!-- Exemplo de quadro com 4 bolinhas e fundo azul -->
      <div class="item" style="background-color: skyblue">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="tooltip">
          Dipirona Sódica 500mg/ml\nAnalgesia leve\nUso hospitalar
        </div>
      </div>

      <!-- Adicione os demais blocos conforme a imagem -->
    </div>
  </body>
</html>
